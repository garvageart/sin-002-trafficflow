services:
  activemq:
    image: apache/activemq-classic:5.18.3
    ports:
      - "61616:61616"
      - "8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/61616'"]
      interval: 5s
      timeout: 3s
      retries: 5

  ingestion-service:
    build:
      context: ..
      target: ingestion-service
      network: host
    ports:
      - "7020:7020"

  intersection-service:
    build:
      context: ..
      target: intersection-service
      network: host
    ports:
      - "7021:7021"
    environment:
      - INGESTION_HOST=ingestion-service
      - ACTIVEMQ_BROKER_URL=tcp://activemq:61616
    depends_on:
      ingestion-service:
        condition: service_started
      activemq:
        condition: service_healthy

  congestion-service:
    build:
      context: ..
      target: congestion-service
      network: host
    ports:
      - "7022:7022"
    environment:
      - ACTIVEMQ_BROKER_URL=tcp://activemq:61616
    depends_on:
      activemq:
        condition: service_healthy

  routing-service:
    build:
      context: ..
      target: routing-service
      network: host
    ports:
      - "7023:7023"
    environment:
      - INTERSECTION_HOST=intersection-service
      - CONGESTION_HOST=congestion-service
      - ACTIVEMQ_BROKER_URL=tcp://activemq:61616
    depends_on:
      intersection-service:
        condition: service_started
      congestion-service:
        condition: service_started
      activemq:
        condition: service_healthy

  intersection-watchdog:
    build:
      context: ..
      target: intersection-watchdog
      network: host
    ports:
      - "7024:7024"
    environment:
      - ACTIVEMQ_BROKER_URL=tcp://activemq:61616
    depends_on:
      activemq:
        condition: service_healthy
